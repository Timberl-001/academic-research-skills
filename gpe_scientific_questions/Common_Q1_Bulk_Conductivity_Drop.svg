  <rect x="30" y="554" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="130" y="578" font-family="Noto Sans SC, DejaVu Sans" font-size="13.5" font-weight="bold" fill="#0369A1" text-anchor="middle">
