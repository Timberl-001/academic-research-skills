  <g transform="translate(78, 250)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" fill-opacity="0.85" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="15" fill="url(#liIon)"/>
    <text x="0" y="5" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Li⁺</text>
    <circle cx="-18" cy="-14" r="7" fill="#38BDF8"/>
    <circle cx="18" cy="-14" r="7" fill="#38BDF8"/>
    <circle cx="0" cy="20" r="7" fill="#38BDF8"/>
  </g>
  <g transform="translate(182, 390)">
