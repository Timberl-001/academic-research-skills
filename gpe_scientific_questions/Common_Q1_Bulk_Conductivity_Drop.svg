    <text x="0" y="5" font-family="DejaVu Sans" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Li⁺</text>
    <circle cx="-22" cy="-14" r="8" fill="#38BDF8"/>
    <circle cx="22" cy="-14" r="8" fill="#38BDF8"/>
    <circle cx="-18" cy="18" r="8" fill="#38BDF8"/>
    <circle cx="18" cy="18" r="8" fill="#38BDF8"/>
    <rect x="-78" y="42" width="156" height="22" rx="5" fill="#FFFFFF" stroke="#D97706"/>
    <text x="0" y="57" font-family="Noto Sans SC, DejaVu Sans" font-size="10.5" font-weight="bold" fill="#92400E" text-anchor="middle">
