  </text>

  <!-- Bulky Solvated SSIP Cluster & Free Anion Migration (Low t_Li+) -->
  <g transform="translate(775, 468)">
    <circle cx="0" cy="0" r="44" fill="#FEF3C7" fill-opacity="0.92" stroke="#D97706" stroke-width="2" stroke-dasharray="4,2"/>
