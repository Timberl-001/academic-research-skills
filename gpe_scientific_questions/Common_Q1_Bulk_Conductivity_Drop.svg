  <circle cx="565" cy="195" r="11.5" fill="url(#crossPoint)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="395" cy="326" r="11.5" fill="url(#crossPoint)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="582" cy="304" r="11.5" fill="url(#crossPoint)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="704" cy="342" r="11.5" fill="url(#crossPoint)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="425" cy="422" r="11.5" fill="url(#crossPoint)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="564" cy="442" r="11.5" fill="url(#crossPoint)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="712" cy="416" r="11.5" fill="url(#crossPoint)" stroke="#FFFFFF" stroke-width="2"/>

