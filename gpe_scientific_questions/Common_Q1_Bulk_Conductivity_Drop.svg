  <path d="M 278 185 C 395 145, 505 235, 625 175 C 715 135, 795 195, 858 165" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M 278 315 C 405 365, 520 265, 650 330 C 745 375, 810 295, 858 330" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M 278 435 C 395 390, 530 485, 655 425 C 750 380, 810 455, 858 425" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>

