  <rect x="256" y="74" width="624" height="556" rx="12" fill="url(#gelBoxBg)" stroke="#F87171" stroke-width="2"/>
  <rect x="256" y="74" width="624" height="36" rx="12" fill="#B91C1C"/>
  <rect x="256" y="94" width="624" height="16" fill="#B91C1C"/>
  <text x="568" y="98" font-family="Noto Sans SC, DejaVu Sans" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    传统凝胶电解质（聚合物骨架 + 溶剂）：三重微观受阻机制
  </text>

  <!-- Inner Illustration Canvas -->
  <rect x="272" y="120" width="592" height="422" rx="10" fill="#FFFFFF" fill-opacity="0.82" stroke="#FCA5A5" stroke-width="1.5"/>

  <!-- 1. Micro-phase Separation / Dead Zone Cloud (Top-Right) -->
  <ellipse cx="755" cy="205" rx="90" ry="56" fill="#E2E8F0" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="755" y="190" font-family="Noto Sans SC, DejaVu Sans" font-size="13.5" font-weight="bold" fill="#334155" text-anchor="middle">
