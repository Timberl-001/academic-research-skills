    </text>
  </g>

  <!-- Sub-caption inside Gel Box -->
  <rect x="272" y="554" width="592" height="62" rx="8" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.8"/>
  <text x="568" y="578" font-family="Noto Sans SC, DejaVu Sans" font-size="14" font-weight="bold" fill="#9F1239" text-anchor="middle">
    体相传输瓶颈：三维网格阻隔 (<tspan font-family="DejaVu Sans">τ↑</tspan>) + 极性位点束缚 Li⁺ (<tspan font-family="DejaVu Sans">ΔE↑</tspan>) + 阴离子自由迁移
  </text>
  <text x="568" y="601" font-family="Noto Sans SC, DejaVu Sans" font-size="12.5" font-weight="bold" fill="#BE123C" text-anchor="middle">
    ➔ 导致凝胶化后室温离子电导率 (<tspan font-family="DejaVu Sans">σ</tspan>) 与锂离子迁移数 (<tspan font-family="DejaVu Sans">t</tspan><tspan font-size="9.5" dy="3">Li⁺</tspan><tspan dy="-3">) 双双下降</tspan>
  </text>

  <!-- ==================== BOTTOM CONCISE SUMMARY (3 SHORT BULLETS, y=646..842) ==================== -->
  <rect x="20" y="646" width="860" height="196" rx="14" fill="#F8FAFC" stroke="#93C5FD" stroke-width="2"/>
  <rect x="36" y="660" width="320" height="28" rx="14" fill="#1D4ED8"/>
  <text x="196" y="679" font-family="Noto Sans SC, DejaVu Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    传统凝胶电解质【体相共性问题】提炼
  </text>

  <circle cx="48" cy="712" r="5" fill="#DC2626"/>
  <text x="64" y="717" font-family="Noto Sans SC, DejaVu Sans" font-size="15" font-weight="bold" fill="#1E293B">
    空间阻隔与相分离：
  </text>
  <text x="204" y="717" font-family="Noto Sans SC, DejaVu Sans" font-size="14.5" fill="#334155">
    交联聚合物骨架分割连续液相（曲折度 <tspan font-family="DejaVu Sans">τ↑</tspan>），且与低极性溶剂易发生微相分离堵塞通道；
  </text>

  <circle cx="48" cy="756" r="5" fill="#DC2626"/>
  <text x="64" y="761" font-family="Noto Sans SC, DejaVu Sans" font-size="15" font-weight="bold" fill="#1E293B">
    极性基团强束缚 Li⁺：
  </text>
  <text x="214" y="761" font-family="Noto Sans SC, DejaVu Sans" font-size="14.5" fill="#334155">
    刚性骨架极性基团对 Li⁺ 配位过强，链段运动受限导致 Li⁺ 陷入深势阱难以解离跳跃；
  </text>

  <circle cx="48" cy="800" r="5" fill="#DC2626"/>
  <text x="64" y="805" font-family="Noto Sans SC, DejaVu Sans" font-size="15" font-weight="bold" fill="#1E293B">
    溶剂化簇庞大与低迁移数：
  </text>
  <text x="244" y="805" font-family="Noto Sans SC, DejaVu Sans" font-size="14.5" fill="#334155">
    常规强溶剂包裹 Li⁺（SSIP）迁移慢，阴离子无骨架锚定自由移动，造成 <tspan font-family="DejaVu Sans">σ</tspan> 与 <tspan font-family="DejaVu Sans">t</tspan><tspan font-size="11" dy="3">Li⁺</tspan><tspan dy="-3"> 双低。</tspan>
  </text>
