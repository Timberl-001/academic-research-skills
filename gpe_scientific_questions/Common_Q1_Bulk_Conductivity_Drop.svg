  </text>

  <!-- Mechanism 2 Callout: Polymer Polar Groups Trapping Li+ -->
  <circle cx="490" cy="252" r="54" fill="#FEE2E2" fill-opacity="0.92" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="458" y1="196" x2="472" y2="228" stroke="#991B1B" stroke-width="3.5"/>
  <circle cx="472" cy="228" r="9.5" fill="url(#polarGroup)"/>
  <line x1="522" y1="200" x2="508" y2="230" stroke="#991B1B" stroke-width="3.5"/>
