  <!-- Card Frame -->
  <rect width="900" height="860" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="900" height="58" rx="18" fill="url(#q1Hdr)"/>
  <rect x="0" y="30" width="900" height="28" fill="url(#q1Hdr)"/>
  <circle cx="40" cy="29" r="17" fill="#FFFFFF" opacity="0.22"/>
  <text x="40" y="36" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
  <text x="70" y="37" font-family="Noto Sans SC, DejaVu Sans" font-size="21" font-weight="bold" fill="#FFFFFF">
    共性问题一（体相）：为什么凝胶化后离子电导率 (<tspan font-family="DejaVu Sans">σ</tspan>) 与迁移数 (<tspan font-family="DejaVu Sans">t</tspan><tspan font-size="14" dy="4">Li⁺</tspan><tspan dy="-4">) 显著下降？</tspan>
  </text>

  <!-- ==================== MAIN VISUAL SCHEMATIC AREA (y=74..634, height=560) ==================== -->
