    </text>
  </g>

  <!-- Free Anion migrating rapidly in opposite direction -> Low t_Li+ -->
  <g transform="translate(635, 485)">
    <ellipse cx="0" cy="0" rx="24" ry="14" fill="url(#anionIon)"/>
    <text x="0" y="4" font-family="Noto Sans SC, DejaVu Sans" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">阴离子⁻</text>
    <line x1="0" y1="16" x2="0" y2="44" stroke="#7C3AED" stroke-width="3.5" marker-end="url(#arrPurple)"/>
    <rect x="-66" y="-36" width="132" height="20" rx="4" fill="#F3E8FF" stroke="#9333EA"/>
    <text x="0" y="-22" font-family="Noto Sans SC, DejaVu Sans" font-size="10" font-weight="bold" fill="#6B21A8" text-anchor="middle">
