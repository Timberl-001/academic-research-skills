  <rect x="58" y="130" width="40" height="410" rx="20" fill="#BAE6FD" opacity="0.55"/>
  <rect x="162" y="130" width="40" height="410" rx="20" fill="#BAE6FD" opacity="0.55"/>
  <line x1="78" y1="525" x2="78" y2="145" stroke="#0284C7" stroke-width="4.5" stroke-dasharray="8,4" marker-end="url(#arrFast)"/>
  <line x1="182" y1="525" x2="182" y2="145" stroke="#0284C7" stroke-width="4.5" stroke-dasharray="8,4" marker-end="url(#arrFast)"/>

