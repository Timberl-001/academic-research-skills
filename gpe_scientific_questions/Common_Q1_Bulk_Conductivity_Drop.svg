  <line x1="490" y1="304" x2="490" y2="278" stroke="#991B1B" stroke-width="3.5"/>
  <circle cx="490" cy="278" r="9.5" fill="url(#polarGroup)"/>

  <circle cx="490" cy="252" r="16" fill="url(#liIon)" stroke="#DC2626" stroke-width="2"/>
  <text x="490" y="257" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Li⁺</text>

  <rect x="415" y="312" width="188" height="42" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="509" y="330" font-family="Noto Sans SC, DejaVu Sans" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">
