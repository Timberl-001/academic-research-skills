  </text>
  <text x="509" y="347" font-family="Noto Sans SC, DejaVu Sans" font-size="10.5" fill="#991B1B" text-anchor="middle">
    链段运动受限 · Li⁺ 陷入深势阱难解离
  </text>

  <!-- Mechanism 1 Callout: Tortuous Path & Steric Blocking -->
  <path d="M 510 525 C 510 475, 465 455, 495 415 C 525 375, 445 355, 365 365 C 305 370, 315 255, 375 235 C 405 225, 365 185, 345 162"
        fill="none" stroke="#D97706" stroke-width="4" stroke-dasharray="7,4" marker-end="url(#arrSlow)"/>
  <rect x="284" y="366" width="176" height="42" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="372" y="384" font-family="Noto Sans SC, DejaVu Sans" font-size="12.5" font-weight="bold" fill="#92400E" text-anchor="middle">
