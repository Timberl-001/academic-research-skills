  </text>
  <path d="M 747 286 L 774 286" stroke="#DC2626" stroke-width="3" marker-end="url(#redA)"/>

  <!-- Cathode Failure Callout 3: Transition Metal Dissolution -->
  <rect x="575" y="365" width="172" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="661" y="388" font-family="Noto Sans SC, DejaVu Sans" font-size="12.5" font-weight="bold" fill="#B45309" text-anchor="middle">
    ⑥ 过渡金属离子 (TMⁿ⁺) 溶出
  </text>
  <text x="661" y="407" font-family="Noto Sans SC, DejaVu Sans" font-size="10.5" fill="#7C2D12" text-anchor="middle">
    正极结构相变坍塌 · 容量快速衰减
  </text>
  <path d="M 774 396 L 747 396" stroke="#D97706" stroke-width="3" marker-end="url(#orgA)"/>

  <!-- Sub-caption inside Interface Box -->
  <rect x="36" y="554" width="828" height="62" rx="8" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.8"/>
  <text x="450" y="578" font-family="Noto Sans SC, DejaVu Sans" font-size="14" font-weight="bold" fill="#9F1239" text-anchor="middle">
    界面演化瓶颈：固-固接触空隙 (<tspan font-family="DejaVu Sans">R</tspan><tspan font-size="10" dy="3">int</tspan><tspan dy="-3">↑) + 脱溶剂化迟缓 (</tspan><tspan font-family="DejaVu Sans">R</tspan><tspan font-size="10" dy="3">ct</tspan><tspan dy="-3">↑) + 溶剂主导脆弱 SEI/CEI</tspan>
  </text>
  <text x="450" y="601" font-family="Noto Sans SC, DejaVu Sans" font-size="12.5" font-weight="bold" fill="#BE123C" text-anchor="middle">
    ➔ 导致负极锂枝晶刺穿短路与正极酸腐蚀溶出，全电池循环寿命严重受限
  </text>

  <!-- ==================== BOTTOM CONCISE SUMMARY (3 SHORT BULLETS, y=646..842) ==================== -->
  <rect x="20" y="646" width="860" height="196" rx="14" fill="#F8FAFC" stroke="#FCA5A5" stroke-width="2"/>
  <rect x="36" y="660" width="320" height="28" rx="14" fill="#B91C1C"/>
  <text x="196" y="679" font-family="Noto Sans SC, DejaVu Sans" font-size="13.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    传统凝胶电解质【界面共性问题】提炼
  </text>

  <circle cx="48" cy="712" r="5" fill="#DC2626"/>
  <text x="64" y="717" font-family="Noto Sans SC, DejaVu Sans" font-size="15" font-weight="bold" fill="#1E293B">
    固-固接触差与脱溶难：
  </text>
  <text x="220" y="717" font-family="Noto Sans SC, DejaVu Sans" font-size="14.5" fill="#334155">
    传统凝胶难浸润电极微孔形成接触盲区，且界面 Li⁺ 脱溶剂化能垒高，界面传质阻力大；
  </text>

  <circle cx="48" cy="756" r="5" fill="#DC2626"/>
  <text x="64" y="761" font-family="Noto Sans SC, DejaVu Sans" font-size="15" font-weight="bold" fill="#1E293B">
    负极有机 SEI 脆弱与枝晶：
  </text>
  <text x="242" y="761" font-family="Noto Sans SC, DejaVu Sans" font-size="14.5" fill="#334155">
    自由溶剂优先还原生成的有机 SEI 疏松易裂，配合局部电流集中诱发锂枝晶不可控生长；
  </text>

  <circle cx="48" cy="800" r="5" fill="#DC2626"/>
  <text x="64" y="805" font-family="Noto Sans SC, DejaVu Sans" font-size="15" font-weight="bold" fill="#1E293B">
    正极高压氧化与 HF 腐蚀：
  </text>
  <text x="242" y="805" font-family="Noto Sans SC, DejaVu Sans" font-size="14.5" fill="#334155">
    常规组分耐氧化性不足，锂盐遇水生成 HF 侵蚀正极引发过渡金属溶出，界面快速退化。
  </text>
</svg>
