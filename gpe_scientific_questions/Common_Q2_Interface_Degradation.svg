  </text>
  <path d="M 747 176 L 774 176" stroke="#DC2626" stroke-width="3" marker-end="url(#redA)"/>

  <!-- Cathode Failure Callout 2: HF Acid Attack -->
  <rect x="575" y="255" width="172" height="62" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="661" y="278" font-family="Noto Sans SC, DejaVu Sans" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">
    ⑤ 锂盐遇痕量水生成 HF 酸
  </text>
  <text x="661" y="297" font-family="Noto Sans SC, DejaVu Sans" font-size="10.5" fill="#991B1B" text-anchor="middle">
