  </text>
  <text x="455" y="428" font-family="Noto Sans SC, DejaVu Sans" font-size="10.5" fill="#92400E" text-anchor="middle">
    溶剂+骨架双重束缚 · 电荷转移慢(R<tspan font-size="8.5" dy="2">ct</tspan><tspan dy="-2">↑)</tspan>
  </text>

  <!-- 3. Right Side: Cathode Oxidation, HF Corrosion & TM Dissolution -->
  <rect x="782" y="120" width="82" height="422" rx="6" fill="url(#cathodeG)"/>
  <text x="823" y="331" font-family="Noto Sans SC, DejaVu Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 823 331)">
    正极表面 (Cathode)
  </text>
  <!-- Broken inhomogeneous CEI -->
  <rect x="764" y="132" width="14" height="396" fill="#FDE68A" stroke="#D97706" stroke-width="1.5" stroke-dasharray="10,7"/>

  <!-- Cathode Failure Callout 1: Oxidative Decomposition & Gas -->
  <rect x="575" y="145" width="172" height="62" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <text x="661" y="168" font-family="Noto Sans SC, DejaVu Sans" font-size="12.5" font-weight="bold" fill="#DC2626" text-anchor="middle">
