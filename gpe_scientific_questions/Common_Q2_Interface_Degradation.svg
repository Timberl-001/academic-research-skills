<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 900 860">
  <defs>
    <linearGradient id="q2Hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="intBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <linearGradient id="anodeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="cathodeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <radialGradient id="liB" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <radialGradient id="nodeB" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="60%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </radialGradient>
    <filter id="sh2" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
    <marker id="redA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="orgA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Card Frame -->
  <rect width="900" height="860" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="900" height="58" rx="18" fill="url(#q2Hdr)"/>
  <rect x="0" y="30" width="900" height="28" fill="url(#q2Hdr)"/>
  <circle cx="40" cy="29" r="17" fill="#FFFFFF" opacity="0.22"/>
  <text x="40" y="36" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02</text>
  <text x="70" y="37" font-family="Noto Sans SC, DejaVu Sans" font-size="21" font-weight="bold" fill="#FFFFFF">
    共性问题二（界面）：为什么传统凝胶/电极界面阻抗高、易长枝晶且成膜失稳？
  </text>

  <!-- ==================== MAIN VISUAL SCHEMATIC AREA (y=74..634, height=560) ==================== -->
  <rect x="20" y="74" width="860" height="556" rx="12" fill="url(#intBg)" stroke="#F87171" stroke-width="2"/>
  <rect x="20" y="74" width="860" height="36" rx="12" fill="#991B1B"/>
  <rect x="20" y="94" width="860" height="16" fill="#991B1B"/>
  <text x="450" y="98" font-family="Noto Sans SC, DejaVu Sans" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    传统凝胶电解质与正负极界面：接触不良 · 脱溶剂化受阻 · 疏松SEI/枝晶与正极腐蚀
  </text>

  <!-- Inner Full-Cell Interface Canvas (x=36..864, y=120..542) -->
  <rect x="36" y="120" width="828" height="422" rx="10" fill="#FFFFFF" fill-opacity="0.88" stroke="#FCA5A5" stroke-width="1.5"/>

  <!-- 1. Left Side: Rough Anode + Interfacial Voids + Fragile Organic SEI + Dendrites -->
  <path d="M 36 120 L 118 120 L 118 170 L 94 202 L 120 238 L 92 280 L 120 325 L 94 370 L 120 415 L 94 460 L 118 500 L 118 542 L 36 542 Z"
        fill="url(#anodeG)"/>
  <text x="68" y="331" font-family="Noto Sans SC, DejaVu Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 68 331)">
    负极表面 (Anode)
  </text>

  <!-- Interfacial Contact Voids -->
  <ellipse cx="122" cy="202" rx="22" ry="28" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,2"/>
  <ellipse cx="122" cy="370" rx="22" ry="28" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,2"/>
  <ellipse cx="122" cy="460" rx="20" ry="24" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,2"/>

  <rect x="152" y="142" width="196" height="50" rx="8" fill="#FFF1F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="250" y="164" font-family="Noto Sans SC, DejaVu Sans" font-size="13" font-weight="bold" fill="#DC2626" text-anchor="middle">
