  </text>
  <text x="250" y="183" font-family="Noto Sans SC, DejaVu Sans" font-size="11" fill="#991B1B" text-anchor="middle">
    凝胶难浸润微孔 · 界面电阻 R<tspan font-size="8.5" dy="2">int</tspan><tspan dy="-2"> 激增</tspan>
  </text>

  <!-- Sharp Li Dendrites Piercing from Hotspots -->
  <polygon points="118,236 278,258 118,282" fill="#94A3B8" stroke="#DC2626" stroke-width="2.2"/>
  <polygon points="118,405 292,428 118,452" fill="#94A3B8" stroke="#DC2626" stroke-width="2.2"/>
  <rect x="156" y="286" width="176" height="28" rx="6" fill="#DC2626"/>
  <text x="244" y="305" font-family="Noto Sans SC, DejaVu Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    ✖ 局部电流集中 → 锂枝晶刺穿
  </text>

  <!-- Broken Organic SEI Pieces -->
  <rect x="122" y="128" width="14" height="38" rx="3" fill="#FCA5A5" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="122" y="315" width="14" height="34" rx="3" fill="#FCA5A5" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="122" y="490" width="14" height="44" rx="3" fill="#FCA5A5" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="152" y="476" width="215" height="50" rx="8" fill="#FFF1F2" stroke="#EF4444" stroke-width="1.8"/>
  <text x="259" y="498" font-family="Noto Sans SC, DejaVu Sans" font-size="13" font-weight="bold" fill="#B91C1C" text-anchor="middle">
    ③ 溶剂优先还原 → 疏松有机SEI
  </text>
  <text x="259" y="517" font-family="Noto Sans SC, DejaVu Sans" font-size="11" fill="#991B1B" text-anchor="middle">
    机械模量低易破裂 · 持续生成死锂
  </text>

  <!-- 2. Center: Gel Skeleton & High Desolvation Barrier at Interface -->
  <path d="M 385 130 C 425 225, 365 345, 415 530" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  <path d="M 525 130 C 485 235, 545 345, 505 530" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  <path d="M 355 215 C 435 190, 485 240, 565 215" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
  <path d="M 355 445 C 435 470, 485 420, 565 445" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
  <circle cx="402" cy="208" r="11" fill="url(#nodeB)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="510" cy="222" r="11" fill="url(#nodeB)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="395" cy="452" r="11" fill="url(#nodeB)" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="515" cy="436" r="11" fill="url(#nodeB)" stroke="#FFFFFF" stroke-width="2"/>

  <!-- High Desolvation Barrier Cluster in Center -->
  <circle cx="455" cy="330" r="56" fill="#FEF3C7" fill-opacity="0.95" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="455" cy="330" r="16" fill="url(#liB)"/>
  <text x="455" y="335" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Li⁺</text>
  <!-- Tightly bound solvent molecules -->
  <rect x="420" y="284" width="70" height="16" rx="4" fill="#FCA5A5" stroke="#DC2626"/>
  <text x="455" y="296" font-family="Noto Sans SC, DejaVu Sans" font-size="9.5" font-weight="bold" fill="#7F1D1D" text-anchor="middle">强配位溶剂壳</text>
  <rect x="420" y="356" width="70" height="16" rx="4" fill="#FCA5A5" stroke="#DC2626"/>
  <text x="455" y="368" font-family="Noto Sans SC, DejaVu Sans" font-size="9.5" font-weight="bold" fill="#7F1D1D" text-anchor="middle">聚合物链束缚</text>

  <rect x="355" y="392" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="455" y="411" font-family="Noto Sans SC, DejaVu Sans" font-size="12.5" font-weight="bold" fill="#B45309" text-anchor="middle">
